workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

build:quality:
  stage: build
  rules:
    - exists:
        - src/**/*.py
        - tests/**/*.py
        - airflow/dags/*.py
  script:
    - ruff check src tests airflow/dags
    - black --check src tests airflow/dags
    - python -m py_compile src/*.py airflow/dags/*.py

test:pytest:
  stage: test
  rules:
    - exists:
        - tests/**/*.py
  script:
    - pytest -q
