job_market_raw_api_count:
  query: |
    SELECT COALESCE(raw_api_count, 0) AS value
    FROM etl_metrics
    ORDER BY run_ts DESC
    LIMIT 1;
  master: true
  metrics:
    - value:
        usage: "GAUGE"
        description: "Latest raw-api object count recorded by ETL"

