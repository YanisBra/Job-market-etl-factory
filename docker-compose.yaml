services:
  postgres:
    image: pgvector/pgvector:pg13
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      TZ: ${TZ}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: airflow-init
    restart: "no"
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-minio}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
      FRANCE_TRAVAIL_SCOPE: ${FRANCE_TRAVAIL_SCOPE}
      FRANCE_TRAVAIL_TOKEN_URL: ${FRANCE_TRAVAIL_TOKEN_URL}
      FRANCE_TRAVAIL_SEARCH_URL: ${FRANCE_TRAVAIL_SEARCH_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RAW_API: ${MINIO_BUCKET_RAW_API}
      MINIO_BUCKET_RAW_SCRAP: ${MINIO_BUCKET_RAW_SCRAP}
      MINIO_SECURE: ${MINIO_SECURE}
      WTTJ_BASE_URL: ${WTTJ_BASE_URL}
      WTTJ_TIMEOUT_SECONDS: ${WTTJ_TIMEOUT_SECONDS}
      WTTJ_USER_AGENT: ${WTTJ_USER_AGENT}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL} || true
      "

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: airflow-webserver
    restart: unless-stopped
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-minio}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
      FRANCE_TRAVAIL_SCOPE: ${FRANCE_TRAVAIL_SCOPE}
      FRANCE_TRAVAIL_TOKEN_URL: ${FRANCE_TRAVAIL_TOKEN_URL}
      FRANCE_TRAVAIL_SEARCH_URL: ${FRANCE_TRAVAIL_SEARCH_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RAW_API: ${MINIO_BUCKET_RAW_API}
      MINIO_BUCKET_RAW_SCRAP: ${MINIO_BUCKET_RAW_SCRAP}
      MINIO_SECURE: ${MINIO_SECURE}
      WTTJ_BASE_URL: ${WTTJ_BASE_URL}
      WTTJ_TIMEOUT_SECONDS: ${WTTJ_TIMEOUT_SECONDS}
      WTTJ_USER_AGENT: ${WTTJ_USER_AGENT}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    command: webserver

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: airflow-scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-minio}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
      FRANCE_TRAVAIL_SCOPE: ${FRANCE_TRAVAIL_SCOPE}
      FRANCE_TRAVAIL_TOKEN_URL: ${FRANCE_TRAVAIL_TOKEN_URL}
      FRANCE_TRAVAIL_SEARCH_URL: ${FRANCE_TRAVAIL_SEARCH_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RAW_API: ${MINIO_BUCKET_RAW_API}
      MINIO_BUCKET_RAW_SCRAP: ${MINIO_BUCKET_RAW_SCRAP}
      MINIO_SECURE: ${MINIO_SECURE}
      WTTJ_BASE_URL: ${WTTJ_BASE_URL}
      WTTJ_TIMEOUT_SECONDS: ${WTTJ_TIMEOUT_SECONDS}
      WTTJ_USER_AGENT: ${WTTJ_USER_AGENT}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    command: scheduler

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - postgres-exporter
      - minio
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        cat >/tmp/prometheus.yml <<'PROMCFG'
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          - job_name: 'postgres'
            static_configs:
              - targets: ['postgres-exporter:9187']
          - job_name: 'minio'
            metrics_path: /minio/v2/metrics/cluster
            static_configs:
              - targets: ['minio:9000']
        PROMCFG
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  dashboard:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./src:/opt/airflow/src
      - ./.env:/opt/airflow/.env
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    working_dir: /opt/airflow
    command: >
      bash -c "
      pip install --no-cache-dir streamlit plotly psycopg2-binary &&
      streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
      "

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
